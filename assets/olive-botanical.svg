 <circle cx="1390" cy="158" r="1.8"/><circle cx="1416" cy="133" r="1.3"/><circle cx="1480" cy="164" r="2"/><circle cx="1529" cy="121" r="1.3"/>
 <circle cx="1394" cy="745" r="2.5"/><circle cx="1432" cy="781" r="1.4"/><circle cx="1512" cy="733" r="1.9"/><circle cx="1542" cy="798" r="1.2"/>
