<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
<defs>
  <radialGradient id="moss"><stop stop-color="#a5b293" stop-opacity=".35"/><stop offset="1" stop-color="#dfe5d1" stop-opacity=".05"/></radialGradient>
  <radialGradient id="cream"><stop stop-color="#e8dfcb" stop-opacity=".7"/><stop offset="1" stop-color="#e8dfcb" stop-opacity="0"/></radialGradient>
  <linearGradient id="leaf"><stop stop-color="#b8c4a8" stop-opacity=".42"/><stop offset="1" stop-color="#edf0e6" stop-opacity=".14"/></linearGradient>
  <g id="leaflet" stroke="#7d8c6b" stroke-width="1.25" stroke-linejoin="round">
    <path d="M0 0 C 19 -29,44 -38,59 -31 C 46 -10,31 1,0 0 Z" fill="url(#leaf)"/>
    <path d="M2 -1 C 18 -8,37 -19,56 -30" fill="none" stroke="#97a58a" stroke-width=".85"/>
  </g>
  <g id="blossom" stroke="#7a8667" stroke-width="1.35" stroke-linejoin="round">
    <path d="M0 0 C -16 -18,-28 -47,-10 -73 C 8 -57,12 -21,0 0Z" fill="#e7e9db" fill-opacity=".82"/>
    <path d="M0 0 C -40 -4,-64 -36,-49 -56 C -23 -56,-2 -28,0 0Z" fill="#e9ebde" fill-opacity=".7"/>
    <path d="M0 0 C 18 -23,44 -35,59 -18 C 49 4,23 11,0 0Z" fill="#d9e2ce" fill-opacity=".76"/>
    <path d="M0 0 C 12 17,13 42,-9 49 C -26 30,-19 7,0 0Z" fill="#d8dfcf" fill-opacity=".53"/>
    <path d="M-5 -9 Q -4 -39,-9 -65 M-4 -7 Q-25 -39,-45 -49 M1 -3 Q 32 -12 52 -17" fill="none" stroke="#acb69d" stroke-width=".8"/>
    <circle cx="0" cy="0" r="4" fill="#ad965f"/><path d="M-3 2l-8 10 M2 1l9 8 M0 -2l2 -15" fill="none" stroke="#ad965f" stroke-width=".9"/>
  </g>
  <g id="twig" fill="none" stroke="#899779" stroke-linecap="round" stroke-width="1.5">
    <path d="M0 0 C 17 -95,50 -202,88 -300"/>
    <path d="M25 -117 C -10 -144,-35 -173,-30 -213 M48 -190 C 73 -218,94 -249,99 -277 M66 -238 C 30 -266,17 -300,26 -340" stroke-width="1.1"/>
  </g>
</defs>
<!-- Soft architectural washes -->
<ellipse cx="-60" cy="150" rx="295" ry="350" fill="url(#cream)"/>
<ellipse cx="1530" cy="200" rx="315" ry="360" fill="url(#moss)"/>
<path d="M-180 100 C20 -70 360 -25 355 130 C343 316 54 348 -120 330Z" fill="#e2e7d7" fill-opacity=".22" stroke="#9fac90" stroke-opacity=".28"/>
<path d="M1430 -110 C1270 30 1328 205 1510 250 C1690 295 1730 175 1740 20Z" fill="#e1e7d6" fill-opacity=".25" stroke="#b3bea4" stroke-opacity=".3"/>
<ellipse cx="1620" cy="920" rx="350" ry="280" fill="url(#cream)"/>
<!-- Left flowering branch -->
<g transform="translate(-6 805) rotate(-6)" opacity=".93">
  <use href="#twig"/>
  <g transform="translate(43 -173) rotate(207) scale(.95)"><use href="#leaflet"/></g>
  <g transform="translate(48 -189) rotate(-18) scale(.78)"><use href="#leaflet"/></g>
  <g transform="translate(24 -118) rotate(185)"><use href="#leaflet"/></g>
  <g transform="translate(83 -300) rotate(22) scale(.75)"><use href="#blossom"/></g>
  <g transform="translate(-23 -218) rotate(-30) scale(.58)"><use href="#blossom"/></g>
